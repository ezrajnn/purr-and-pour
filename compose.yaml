services:
  purr_pour_db:
    image: mysql:8.0
    container_name: purr_pour_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: purr_and_pour
      MYSQL_USER: purr_user
      MYSQL_PASSWORD: purr_password
    ports:
      - "3307:3306"
    volumes:
      - purr_pour_db_data:/var/lib/mysql
    networks:
      - purr_pour_network

  purr_pour_phpmyadmin:
    image: phpmyadmin
    container_name: purr_pour_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: purr_pour_db
    ports:
      - "7777:80"
    networks:
      - purr_pour_network

volumes:
  purr_pour_db_data:

networks:
  purr_pour_network: